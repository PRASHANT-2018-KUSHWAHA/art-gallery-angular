<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        var base = '/art-gallery-angular/';
        var path = window.location.pathname + window.location.search + window.location.hash;
        var last = path.split('/').filter(Boolean).pop();
        // If the path looks like a file (has a dot), let the 404 respond for missing assets
        if (last && last.indexOf('.') > -1) { return; }
        var indexPath = base + 'index.html';
        fetch(indexPath).then(function (r) { return r.text(); }).then(function (html) {
          document.open();
          document.write(html);
          document.close();
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, '', path);
          }
        }).catch(function () {
          window.location.replace(indexPath);
        });
      }());
    </script>
    <p>Redirecting…</p>
  </body>
</html>
