name: Deploy to GitHub Pages

# Required permissions: allow the workflow to push to the repository and manage Pages
permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (with computed base-href)
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          REPO="$REPO_NAME"
          if [[ "$REPO" == *".github.io" ]]; then
            BASEHREF="/"
          else
            BASEHREF="/$REPO/"
          fi
          echo "Repository: $REPO"
          echo "Using base-href: $BASEHREF"
          npm run build -- --configuration production --base-href "$BASEHREF"

      - name: Add SPA-friendly 404 redirect
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          REPO="$REPO_NAME"
          if [[ "$REPO" == *".github.io" ]]; then
            BASEHREF="/"
          else
            BASEHREF="/$REPO/"
          fi
          # Create a 404.html in the build dir that redirects to index.html so client-side routing works
          DIST_DIR="dist/art-gallery"
          mkdir -p "$DIST_DIR"
          printf '%s\n' '<!doctype html>' '<html>' '  <head>' '    <meta charset="utf-8" />' '    <meta name="robots" content="noindex">' '    <title>Redirecting...</title>' '  </head>' '  <body>' '    <script>' "      (function () {" "        var base = '${BASEHREF}';" "        var path = window.location.pathname + window.location.search + window.location.hash;" "        var last = path.split('/').filter(Boolean).pop();" "        // If the path looks like a file (has a dot), let the 404 respond for missing assets" "        if (last && last.indexOf('.') > -1) { return; }" "        var indexPath = base + 'index.html';" "        fetch(indexPath).then(function (r) { return r.text(); }).then(function (html) {" "          document.open();" "          document.write(html);" "          document.close();" "          if (window.history && window.history.replaceState) {" "            window.history.replaceState({}, '', path);" "          }" "        }).catch(function () {" "          window.location.replace(indexPath);" "        });" "      }());" '    </script>' '    <p>Redirecting…</p>' '  </body>' '</html>' > "$DIST_DIR/404.html"
          if [[ ! -f "$DIST_DIR/404.html" ]]; then
            echo "Failed to create 404.html in: $DIST_DIR"
            exit 1
          fi

      - name: Prune stale worktrees and show git info
        run: |
          set -e
          echo "Git version: $(git --version)"
          # Remove stale worktrees and show current list to avoid remove failures later
          git worktree prune || true
          git worktree list || true
          # Show git status/debug info
          git status --porcelain || true
          git rev-parse --abbrev-ref HEAD || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/art-gallery
          token: ${{ secrets.GITHUB_TOKEN }}
